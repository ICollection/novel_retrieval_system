# 站点服务（含登录令牌）
station:
  # 监听端口
  port: 8048
  # 上下文目录（接口路径前缀）
  context_path: /service
  # 运行模式：debug、release、test
  mode: release
  # 登录令牌签名密钥（随机生成，泄漏后需重新生成）
  secret: bbc91851ffc98ee7478557eac744ef49f6c8c28d5693e49f114d949cf013060e67214e5d93c31dd55b9b343a40a7dfdd
  # 登录令牌有效期（小时）
  expire: 24
  # 并发处理小说文件的数量
  concurrency: 3

# 模型服务（OpenAI 兼容接口）
models:
  # 向量模型
  embedding:
    # 接口地址，包含版本路径
    address: http://192.168.1.100:5050/v1
    # 模型名称
    name: Qwen3-Embedding-0.6B-f16
    # 接口密钥，为空表示不需要认证
    key: ""
  # 语言模型
  language:
    # 接口地址，包含版本路径
    address: http://192.168.1.100:5050/v1
    # 模型名称（使用前请填写）
    name: "Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-IQ2_M"
    # 接口密钥，为空表示不需要认证
    key: ""

# PostgreSQL 数据库
postgre:
  # 服务地址
  host: 192.168.1.100
  # 服务端口
  port: 5432
  # 登录名
  username: novel
  # 登录密码，建议通过环境变量注入，不要写死在这里
  password: Passw0rd@123
  # 数据库名称
  database: novel
  # SSL 模式：disable / require
  sslmode: disable

# Qdrant 向量数据库
qdrant:
  # 服务地址
  host: 192.168.1.100
  # gRPC 端口
  port: 6334
  # API Key，未开启鉴权时留空
  api_key:
  # 集合名称
  collection: novel

# MinIO 对象存储
minio:
  # 服务地址（不包含协议和端口）
  endpoint: 192.168.1.100
  # 服务端口
  port: 9000
  # 登录名（Access Key）
  access_key: novel
  # 登录密码（Secret Key）
  secret_key: Passw0rd@123
  # 存储桶名称
  bucket: novel
  # 是否使用 HTTPS
  use_ssl: false
  # 区域，MinIO 默认为 us-east-1
  region: us-east-1
